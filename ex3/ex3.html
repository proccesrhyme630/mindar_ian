<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>

  <body>
    
    <a-scene mindar-image="imageTargetSrc: targets.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <a-asset-item id="model1" src="Bsb.glb"></a-asset-item>
            <a-asset-item id="model2" src="Dismissing_Gesture.glb"></a-asset-item>
            <a-asset-item id="model3" src="macarena_dance.glb"></a-asset-item>
            <a-asset-item id="model4" src="Waldo3d.glb"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
            <a-gltf-model src="#model4"
                scale="0.005 0.005 0.005"
                position="0 0 0"
                rotation="90 0 0">
            </a-gltf-model>          
        </a-entity>

        <a-entity mindar-image-target="targetIndex: 1">
            <a-gltf-model src="#model2"
                scale="0.005 0.005 0.005"
                position="0 0 0"
                rotation="90 0 0"
                animation-mixer="clip: Dismissing_Gesture">
            </a-gltf-model>          
        </a-entity>

        <a-entity mindar-image-target="targetIndex: 2">
            <a-gltf-model src="#model3"
                scale="0.005 0.005 0.005"
                position="0 0 0"
                rotation="90 0 0"
                animation-mixer="clip: macarena_dance">
            </a-gltf-model>          
        </a-entity>

        <a-entity mindar-image-target="targetIndex: 3">
            <a-gltf-model src="#model1"
                scale="0.005 0.005 0.005"
                position="0 0 0"
                rotation="90 0 0"
                animation-mixer="clip: baseball_hit">
            </a-gltf-model>          
        </a-entity>

    </a-scene>
  </body>
</html>
